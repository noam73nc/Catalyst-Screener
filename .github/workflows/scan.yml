name: Pre-Market Catalyst Scan

on:
  schedule:
    - cron: '0 12 * * 1-5'  # 08:00 AM NY Time / 14:00 שעון חורף ישראל
    - cron: '0 13 * * 1-5'  # 09:00 AM NY Time / 15:00 שעון חורף ישראל
  workflow_dispatch:
  
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas yfinance google-genai tradingview-screener

      - name: Run scan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scan_runner.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/latest_scan.csv
          git diff --staged --quiet || git commit -m "Auto scan $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
